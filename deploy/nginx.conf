# ITPidia: hardened nginx config for a static site.
# Install: copy to /etc/nginx/sites-available/itpidia, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# The site sits behind the Cloudflare proxy. Run cloudflare-origin.sh first: it makes nginx see the real
# visitor IP (needed for the rate limits below) and firewalls ports 80/443 to Cloudflare only.
# Cloudflare dashboard: SSL/TLS mode "Full (strict)", "Always Use HTTPS" on, "Minimum TLS 1.2".
#
# Add these lines inside the `http { }` block of /etc/nginx/nginx.conf:
#   server_tokens off;
#   limit_req_zone  $binary_remote_addr zone=itp_req:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=itp_conn:10m;

# Requests that hit the VPS IP or an unknown Host get dropped (stops IP scanners from finding the site).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name itpidia.com www.itpidia.com;
    return 301 https://itpidia.com$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.itpidia.com;
    ssl_certificate     /etc/ssl/itpidia/origin.pem;
    ssl_certificate_key /etc/ssl/itpidia/origin.key;
    return 301 https://itpidia.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itpidia.com;

    # Easiest with Cloudflare: SSL/TLS > Origin Server > Create Certificate (15 years), save both files here.
    ssl_certificate     /etc/ssl/itpidia/origin.pem;
    ssl_certificate_key /etc/ssl/itpidia/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:itp_ssl:10m;
    ssl_session_tickets off;

    root  /var/www/itpidia;
    index index.html;
    autoindex off;
    charset utf-8;

    # The site is static: it never needs a request body, uploads or big headers.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    limit_req  zone=itp_req burst=40 nodelay;
    limit_conn itp_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Only GET and HEAD. POST/PUT/DELETE etc. have nothing to talk to.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Security headers (kept in sync with the CSP meta tag in index.html)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Allowlist: only the real site files are reachable. Everything else (.git, README, deploy/, backups,
    # .env, *.php probes ...) returns 404, even if it is accidentally copied to the server.
    # Note: never put add_header inside these locations, it would drop all the headers above.
    location = /           { expires -1; }
    location = /index.html { expires -1; }
    location ~ ^/(styles\.css|script\.js)$ { expires 1h; }
    location ~ ^/assets/[A-Za-z0-9._-]+\.(png|jpe?g|webp|ico)$ { expires 30d; }
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; return 200 "User-agent: *\nAllow: /\n"; default_type text/plain; }
    location / { return 404; }
}
